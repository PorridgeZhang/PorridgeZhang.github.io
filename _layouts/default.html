<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <meta name="color-scheme" content="light">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=optional"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="site-brand" href="#about" aria-label="Back to introduction">
                <img class="brand-mark" src="./images/logo.webp" width="192" height="192" alt="">
                <span class="brand-name">{{ site.title }}</span>
            </a>
            <nav class="primary-nav" aria-label="Primary navigation">
                <a href="#about">About</a>
                <a href="#publications">Research</a>
                <a href="#awards">Awards</a>
                <a href="#internships">Experience</a>
                <a href="#projects">Projects</a>
                <a href="#gallery">Gallery</a>
            </nav>
        </div>
    </header>

    <div class="layout-wrapper">
        {% include sidebar.html %}
        <main class="page-content" aria-label="Main content">
            <div class="container">
                {{ content }}
            </div>
        </main>
    </div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
            <p>Robotics &amp; Embodied AI</p>
            <div class="visitor-map" aria-label="Visitor map">
                <script type="text/javascript" id="clustrmaps"
                    src="//clustrmaps.com/map_v2.js?d=r12A3eQ6pFpJNO52yqXPZxOuPddUWvF8Q3mOKLCo39I&amp;cl=ffffff&amp;w=a"
                    async></script>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>

</html>
